# One-click deploy on Render (Blueprint). WebSockets are supported on web services.
services:
  - type: web
    name: duality
    runtime: node
    # 'free' needs no payment method but sleeps after 15 min idle (first load then takes ~30–60 s).
    # Switch to 'starter' for an always-on instance.
    plan: free
    # --include=dev: NODE_ENV=production would otherwise make `npm ci` skip Vite/TypeScript/esbuild.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
