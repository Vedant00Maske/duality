<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0d0b17;font-family:Nunito,sans-serif;color:#f3eefc}
.bg{position:absolute;inset:0;background:url(shot2.png) center 62%/cover;filter:saturate(1.15)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,11,23,.96) 0%,rgba(13,11,23,.82) 38%,rgba(13,11,23,.15) 70%,rgba(13,11,23,.05) 100%)}
.inset{position:absolute;right:40px;bottom:36px;width:430px;border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,.18);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.inset img{display:block;width:100%}
.txt{position:absolute;left:64px;top:92px;width:600px}
h1{font:700 118px/1 Fredoka;letter-spacing:.06em;margin:0}
.e{background:linear-gradient(180deg,#ffe08a,#ff7a2f);-webkit-background-clip:text;color:transparent}
.t{background:linear-gradient(180deg,#d9fbff,#2aa2ee);-webkit-background-clip:text;color:transparent}
p.tag{font:600 32px/1.25 Fredoka;margin:18px 0 14px}
p.tag b{color:#c79bff}
p.sub{font-size:20px;line-height:1.5;color:#c9c0de;margin:0 0 26px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-weight:800;font-size:16px}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="inset"><img src="shot1.png"></div>
<div class="txt">
<h1><span class="e">DUAL</span><span class="t">ITY</span></h1>
<p class="tag">Two elements. Two devices.<br>One <b>Resonance Link</b>.</p>
<p class="sub">An online co-op puzzle platformer. Fire and water, twelve levels, and an energy tether that powers the world, but only when you work together.</p>
<div class="chips"><span class="chip">2 players</span><span class="chip">12 levels</span><span class="chip">No sign-up</span><span class="chip">Phone or laptop</span></div>
</div></body></html>
